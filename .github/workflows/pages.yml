name: Deploy GitHub Pages (Preview)

on:
  push:
    branches: [main, claude/hobbytischlerei-relaunch-b6dpp9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Statischer Export kann kein Backend – die Formular-API gibt es nur
      # auf Vercel. Das Formular fällt auf Pages automatisch auf E-Mail zurück.
      - name: API-Routen für statischen Export entfernen
        run: rm -rf src/app/api
      - name: Build (statischer Export)
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
